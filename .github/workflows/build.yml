name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/tallyhelper app/src/main/res/layout app/src/main/res/drawable app/src/main/res/xml app/src/main/assets

        cp icon.png app/src/main/res/drawable/app_icon.png 2>/dev/null || cp icon.jpg app/src/main/res/drawable/app_icon.png 2>/dev/null || cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#26231C" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#D97B1F" android:pathData="M54,22L24,37L54,52L84,37Z"/><path android:fillColor="#B6620F" android:pathData="M24,39L24,69L52,85L52,54Z"/><path android:fillColor="#EDE2CC" android:pathData="M56,54L56,85L84,69L84,39Z"/></vector>
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "TallyHelper"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.example.tallyhelper'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.tallyhelper"
                minSdk 24
                targetSdk 34
                versionCode 6
                versionName "1.5"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            lint { abortOnError false; checkReleaseBuilds false }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
        EOF

        cat << 'EOF' > app/src/main/res/xml/provider_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-path name="external_files" path="." />
            <external-path name="download_files" path="Download/" />
            <files-path name="internal_files" path="." />
        </paths>
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <application
                android:allowBackup="true"
                android:icon="@drawable/app_icon"
                android:roundIcon="@drawable/app_icon"
                android:label="কার্টুন টালি"
                android:supportsRtl="true"
                android:usesCleartextTraffic="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="com.example.tallyhelper.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/provider_paths" />
                </provider>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#EDE2CC">
            <WebView android:id="@+id/webView" android:layout_width="match_parent" android:layout_height="match_parent" />
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/tallyhelper/MainActivity.java
        package com.example.tallyhelper;
        import android.Manifest;
        import android.content.*;
        import android.media.MediaScannerConnection;
        import android.net.Uri;
        import android.os.*;
        import android.provider.MediaStore;
        import android.util.Base64;
        import android.webkit.*;
        import android.widget.Toast;
        import androidx.activity.result.*;
        import androidx.activity.result.contract.ActivityResultContracts;
        import androidx.appcompat.app.*;
        import androidx.core.content.FileProvider;
        import java.io.*;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private final ActivityResultLauncher<String[]> permLauncher = registerForActivityResult(new ActivityResultContracts.RequestMultiplePermissions(), p -> {});
            private final ActivityResultLauncher<Intent> pickerLauncher = registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), res -> {
                if (filePathCallback != null) {
                    Uri[] r = (res.getResultCode() == RESULT_OK && res.getData() != null) ? WebChromeClient.FileChooserParams.parseResult(res.getResultCode(), res.getData()) : null;
                    filePathCallback.onReceiveValue(r);
                    filePathCallback = null;
                }
            });

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                permLauncher.launch(new String[]{Manifest.permission.CAMERA});

                webView = findViewById(R.id.webView);
                WebSettings s = webView.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setAllowFileAccess(true);
                s.setAllowFileAccessFromFileURLs(true);
                s.setAllowUniversalAccessFromFileURLs(true);
                s.setUseWideViewPort(true);
                s.setLoadWithOverviewMode(true);

                webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(PermissionRequest r) { runOnUiThread(() -> r.grant(r.getResources())); }
                    @Override
                    public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams fp) {
                        filePathCallback = cb;
                        try { pickerLauncher.launch(fp.createIntent()); return true; } catch(Exception e) { filePathCallback = null; return false; }
                    }
                });
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }

            public class WebAppInterface {
                @JavascriptInterface
                public void savePdf(String base64Data, String fileName) {
                    try {
                        String clean = base64Data.contains(",") ? base64Data.split(",")[1] : base64Data;
                        byte[] bytes = Base64.decode(clean, Base64.DEFAULT);
                        final Uri finalUri;

                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                            ContentValues cv = new ContentValues();
                            cv.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                            cv.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                            cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                            Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                            if (u != null) {
                                OutputStream os = getContentResolver().openOutputStream(u);
                                if (os != null) { os.write(bytes); os.close(); }
                            }
                            finalUri = u;
                        } else {
                            File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                            if (!dir.exists()) dir.mkdirs();
                            File f = new File(dir, fileName);
                            FileOutputStream fos = new FileOutputStream(f);
                            fos.write(bytes); fos.close();
                            MediaScannerConnection.scanFile(MainActivity.this, new String[]{f.getAbsolutePath()}, new String[]{"application/pdf"}, null);
                            finalUri = FileProvider.getUriForFile(MainActivity.this, "com.example.tallyhelper.fileprovider", f);
                        }

                        runOnUiThread(() -> {
                            if (finalUri != null) {
                                new AlertDialog.Builder(MainActivity.this)
                                    .setTitle("✅ PDF সংরক্ষিত হয়েছে!")
                                    .setMessage("ফাইলটি Download ফোল্ডারে সেভ হয়েছে।\nআপনি কি এখনই এটি দেখতে চান?")
                                    .setPositiveButton("ওপেন করুন", (d, w) -> {
                                        try {
                                            Intent i = new Intent(Intent.ACTION_VIEW);
                                            i.setDataAndType(finalUri, "application/pdf");
                                            i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                                            startActivity(Intent.createChooser(i, "PDF ওপেন করুন"));
                                        } catch(Exception e) {
                                            Toast.makeText(MainActivity.this, "PDF দেখার মতো কোনো অ্যাপ নেই", Toast.LENGTH_SHORT).show();
                                        }
                                    })
                                    .setNegativeButton("না, থাক", null)
                                    .show();
                            }
                        });
                    } catch(Exception e) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "PDF সেভ ত্রুটি: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                    }
                }
            }
        }
        EOF

        cp index.html app/src/main/assets/index.html || cp *.html app/src/main/assets/index.html

        sed -i 's|pdf.save(filename);|if(window.AndroidBridge){window.AndroidBridge.savePdf(pdf.output("datauristring"),filename);}else{pdf.save(filename);}|' app/src/main/assets/index.html || true

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.5"

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TallyHelper-APK
        path: app/build/outputs/apk/debug/*.apk
